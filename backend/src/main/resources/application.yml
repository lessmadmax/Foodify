spring:
  application:
    name: foodify-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/foodify?connectionTimeZone=UTC}
    username: ${DB_USER:foodify}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 25MB

app:
  storage: ${PHOTO_STORAGE:local}
  s3:
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
  photos: ${PHOTO_DIRECTORY:./data/photos}
  worker-enabled: ${WORKER_ENABLED:true}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
    base-url: https://api.openai.com/v1
    monthly-request-limit: ${AI_MONTHLY_REQUEST_LIMIT:100}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
