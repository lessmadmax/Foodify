<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="690" viewBox="0 100 1540 690" role="img" aria-label="Foodify 사진 분석 및 AR 중량 산출 단계별 입력과 출력"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#718395"/></marker></defs><style>
text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;fill:#182534}
.canvas{fill:#fff}.node>rect:first-child{fill:#fff;stroke:#cbd5e1;stroke-width:1.6}
.stripe{fill:#3879b8}.server .stripe{fill:#54756b}.ai .stripe{fill:#b0843a}.result .stripe{fill:#4657a5}
.title{fill:#152637}.section{fill:#17384e}.sub{fill:#576675}.label{fill:#3879b8}
.connector{stroke:#718395;stroke-width:2.6;fill:none;stroke-linejoin:round}
.flow-label{fill:#5a6c7d}.formula{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1}
</style><rect class="canvas" width="1540" height="1840"/><text x="40" y="44" font-size="32" class="title" font-weight="700">Foodify 사진 입력에서 결과 산출까지</text><text x="40" y="78" font-size="18" class="sub">2026년 11월 12일 코드 기준  ·  각 단계의 입력과 출력  ·  단위 g / cm / cm² / mL</text><text x="40" y="124" font-size="25" class="section" font-weight="700">A. 최초 음식 사진 분석</text><text x="40" y="154" font-size="18" class="sub">음식명·기본 중량과 영양 결과를 먼저 산출합니다. AR 측정은 이 결과에서 음식별로 선택합니다.</text><g class="node device"><rect x="40" y="181" width="460" height="258" rx="15"/><rect class="stripe" x="40" y="181" width="7" height="258" rx="3"/><text x="62" y="212" font-size="23" class="title" font-weight="700">A1  음식 사진 촬영·선택</text><text x="62" y="239" font-size="16" class="sub">모바일 · 카메라 / 갤러리</text><text x="62" y="270" font-size="16" class="label" font-weight="700">입력</text><text x="108" y="270" font-size="18" class="">촬영 대상 장면 또는 갤러리 이미지</text><text x="62" y="305" font-size="16" class="label" font-weight="700">출력</text><text x="108" y="305" font-size="18" class="">사진 1~3장, 사진 경로 paths[]</text><text x="108" y="330" font-size="18" class="">촬영 정보 captureInfo</text></g><g class="node device"><rect x="540" y="181" width="460" height="258" rx="15"/><rect class="stripe" x="540" y="181" width="7" height="258" rx="3"/><text x="562" y="212" font-size="23" class="title" font-weight="700">A2  음식 분류 후보 산출</text><text x="562" y="239" font-size="16" class="sub">기기 · Food-101-93M / ONNX</text><text x="562" y="270" font-size="16" class="label" font-weight="700">입력</text><text x="608" y="270" font-size="18" class="">사진별 RGB 이미지 → 224×224</text><text x="562" y="305" font-size="16" class="label" font-weight="700">출력</text><text x="608" y="305" font-size="18" class="">foodRecognition.predictions[]</text><text x="608" y="330" font-size="18" class="">사진별 {label, score} 상위 3개</text><text x="562" y="364" font-size="16" class="sub">분류 실패 시 후보 없이 사진 분석을 계속합니다.</text></g><g class="node server"><rect x="1040" y="181" width="460" height="258" rx="15"/><rect class="stripe" x="1040" y="181" width="7" height="258" rx="3"/><text x="1062" y="212" font-size="23" class="title" font-weight="700">A3  업로드·검증·분석 접수</text><text x="1062" y="239" font-size="16" class="sub">서버 · POST /api/v1/meals</text><text x="1062" y="270" font-size="16" class="label" font-weight="700">입력</text><text x="1108" y="270" font-size="18" class="">사진 + captureInfo + 멱등 키</text><text x="1062" y="305" font-size="16" class="label" font-weight="700">출력</text><text x="1108" y="305" font-size="18" class="">정리된 JPEG, 검증된 촬영 근거</text><text x="1108" y="330" font-size="18" class="">식단 ID · 분석 작업 QUEUED</text><text x="1062" y="364" font-size="16" class="sub">Top-1 &lt; 0.6 후보는 AI 입력에서 제외합니다.</text></g><g class="node ai"><rect x="1040" y="500" width="460" height="258" rx="15"/><rect class="stripe" x="1040" y="500" width="7" height="258" rx="3"/><text x="1062" y="531" font-size="23" class="title" font-weight="700">A4  음식명·기본 중량 추정</text><text x="1062" y="558" font-size="16" class="sub">외부 AI · 기본 gpt-4o-mini</text><text x="1062" y="589" font-size="16" class="label" font-weight="700">입력</text><text x="1108" y="589" font-size="18" class="">사진 + 유효 음식 후보 + 촬영 근거</text><text x="1062" y="624" font-size="16" class="label" font-weight="700">출력</text><text x="1108" y="624" font-size="18" class="">items[]: name, grams, ingredients</text><text x="1108" y="649" font-size="18" class="">weightEstimate{범위·가정}, uncertainty</text><text x="1062" y="683" font-size="16" class="sub">grams는 참고 추정값이며 판단 불가 시 null입니다.</text></g><g class="node server"><rect x="540" y="500" width="460" height="258" rx="15"/><rect class="stripe" x="540" y="500" width="7" height="258" rx="3"/><text x="562" y="531" font-size="23" class="title" font-weight="700">A5  영양 DB 음식 연결</text><text x="562" y="558" font-size="16" class="sub">서버 · 검색 / 후보 선택 / 사용자 보정</text><text x="562" y="589" font-size="16" class="label" font-weight="700">입력</text><text x="608" y="589" font-size="18" class="">음식명 name, 재료 ingredients</text><text x="562" y="624" font-size="16" class="label" font-weight="700">출력</text><text x="608" y="624" font-size="18" class="">foodId · 식품 대분류 · 자료원</text><text x="608" y="649" font-size="18" class="">기준 중량과 기준 영양값</text><text x="562" y="683" font-size="16" class="sub">정확 일치 → 원재료·범주 → 포함 검색</text></g><g class="node result"><rect x="40" y="500" width="460" height="258" rx="15"/><rect class="stripe" x="40" y="500" width="7" height="258" rx="3"/><text x="62" y="531" font-size="23" class="title" font-weight="700">A6  영양 계산·결과 표시</text><text x="62" y="558" font-size="16" class="sub">서버 → 앱 · 자동 저장 후 확인·수정</text><text x="62" y="589" font-size="16" class="label" font-weight="700">입력</text><text x="108" y="589" font-size="18" class="">grams + foodId + DB 기준 영양값</text><text x="62" y="624" font-size="16" class="label" font-weight="700">출력</text><text x="108" y="624" font-size="18" class="">음식별 중량·kcal·탄수화물·단백질·지방</text><text x="108" y="649" font-size="18" class="">계산 근거 · 항목/식단 완료 상태</text><text x="62" y="683" font-size="16" class="sub">중량·DB·필수 영양값을 갖추면 완료 처리합니다.</text></g><path class="connector" d="M500 310 H534" marker-end="url(#arrow)"/><path class="connector" d="M1000 310 H1034" marker-end="url(#arrow)"/><path class="connector" d="M1270 439 V494" marker-end="url(#arrow)"/><text x="1040" y="477" font-size="17" class="flow-label" font-weight="600">정리된 사진 + 유효 후보</text><path class="connector" d="M1040 629 H1006" marker-end="url(#arrow)"/><path class="connector" d="M540 629 H506" marker-end="url(#arrow)"/><path class="connector" d="M270 758 V785 H20 V892 H270 V899" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="300" y="809" font-size="17" class="flow-label" font-weight="600">선택: 결과 화면에서 음식명·foodId를 전달하여 AR 중량 측정</text><text x="40" y="849" font-size="25" class="section" font-weight="700">B. 선택한 음식의 AR 중량 재산출</text><text x="40" y="878" font-size="18" class="sub">별도 촬영 → 윤곽 확인 → 면적·높이 → 분류 밀도 환산 → 기존 영양 결과 갱신</text><g class="node device"><rect x="40" y="905" width="460" height="287" rx="15"/><rect class="stripe" x="40" y="905" width="7" height="287" rx="3"/><text x="62" y="936" font-size="23" class="title" font-weight="700">B1  AR 촬영·데이터 수집</text><text x="62" y="963" font-size="16" class="sub">기기 · ARCore / 약 5초 촬영</text><text x="62" y="994" font-size="16" class="label" font-weight="700">입력</text><text x="108" y="994" font-size="18" class="">선택 음식명·foodId + 현재 촬영 장면</text><text x="62" y="1029" font-size="16" class="label" font-weight="700">출력</text><text x="108" y="1029" font-size="18" class="">대표 사진, 프레임별 깊이(mm)·신뢰도</text><text x="108" y="1054" font-size="18" class="">카메라 자세·내부 파라미터 K</text><text x="108" y="1079" font-size="18" class="">특징점 · 타임스탬프</text><text x="62" y="1113" font-size="16" class="sub">음식명·foodId는 이후 중량 환산까지 유지합니다.</text></g><g class="node device"><rect x="540" y="905" width="460" height="287" rx="15"/><rect class="stripe" x="540" y="905" width="7" height="287" rx="3"/><text x="562" y="936" font-size="23" class="title" font-weight="700">B2  음식 영역 분할·사용자 확인</text><text x="562" y="963" font-size="16" class="sub">기기 · MobileSAM + 사용자</text><text x="562" y="994" font-size="16" class="label" font-weight="700">입력</text><text x="608" y="994" font-size="18" class="">대표 사진 + 음식/제외 점(u,v,label)</text><text x="562" y="1029" font-size="16" class="label" font-weight="700">출력</text><text x="608" y="1029" font-size="18" class="">foodPolygons[] · reviewed=true</text><text x="608" y="1054" font-size="18" class="">사용자가 확인한 음식 윤곽</text><text x="562" y="1088" font-size="16" class="sub">손으로 직접 그린 윤곽도 사용할 수 있습니다.</text></g><g class="node device"><rect x="1040" y="905" width="460" height="287" rx="15"/><rect class="stripe" x="1040" y="905" width="7" height="287" rx="3"/><text x="1062" y="936" font-size="23" class="title" font-weight="700">B3  깊이 정렬·면적·높이 계산</text><text x="1062" y="963" font-size="16" class="sub">기기 · ArFusion / ArVolume</text><text x="1062" y="994" font-size="16" class="label" font-weight="700">입력</text><text x="1108" y="994" font-size="18" class="">확인 윤곽 + 프레임별 깊이·신뢰도</text><text x="1108" y="1019" font-size="18" class="">카메라 자세·K + 특징점·접시 영역</text><text x="1062" y="1054" font-size="16" class="label" font-weight="700">출력</text><text x="1108" y="1054" font-size="18" class="">areaCm2 · distanceMm · mmPerPixel</text><text x="1108" y="1079" font-size="18" class="">사진 실제 크기 · measuredHeightCm?</text><text x="1108" y="1104" font-size="18" class="">높이 출처 DEPTH / FEATURE_POINTS</text><text x="1062" y="1138" font-size="16" class="sub">거리 실패: 재촬영 / 높이 실패: AI 대체</text></g><g class="node ai"><rect x="1040" y="1270" width="460" height="287" rx="15"/><rect class="stripe" x="1040" y="1270" width="7" height="287" rx="3"/><text x="1062" y="1301" font-size="23" class="title" font-weight="700">B4  적용할 평균 높이 결정</text><text x="1062" y="1328" font-size="16" class="sub">기기 높이 우선 / 측정 불가 시 AI 대체</text><text x="1062" y="1359" font-size="16" class="label" font-weight="700">입력</text><text x="1108" y="1359" font-size="18" class="">기기 높이 존재 → /ar/preview</text><text x="1108" y="1384" font-size="18" class="">없음 → 사진·음식명·면적·축척</text><text x="1108" y="1409" font-size="18" class="">/ar/height: AI 평균 높이 추정 3회</text><text x="1062" y="1444" font-size="16" class="label" font-weight="700">출력</text><text x="1108" y="1444" font-size="18" class="">heightCm · heightMethod</text><text x="1108" y="1469" font-size="18" class="">기기 표본 수 또는 AI 높이 응답 목록</text><text x="1062" y="1503" font-size="16" class="sub">AI는 성공 응답의 중앙값을 사용합니다.</text></g><g class="node server"><rect x="540" y="1270" width="460" height="287" rx="15"/><rect class="stripe" x="540" y="1270" width="7" height="287" rx="3"/><text x="562" y="1301" font-size="23" class="title" font-weight="700">B5  부피·중량 미리보기 계산</text><text x="562" y="1328" font-size="16" class="sub">서버 · MealService / DensityGroups</text><text x="562" y="1359" font-size="16" class="label" font-weight="700">입력</text><text x="608" y="1359" font-size="18" class="">음식명·foodId + A(cm²) + h(cm)</text><text x="562" y="1394" font-size="16" class="label" font-weight="700">출력</text><text x="608" y="1394" font-size="18" class="">분류별 밀도 ρ(g/mL)</text><text x="608" y="1419" font-size="18" class="">부피 V=A×h(mL)</text><text x="608" y="1444" font-size="18" class="">중량 W=V×ρ(g)</text><text x="562" y="1478" font-size="16" class="sub">기기 높이 경로에서는 외부 AI 호출이 없습니다.</text></g><g class="node result"><rect x="40" y="1270" width="460" height="287" rx="15"/><rect class="stripe" x="40" y="1270" width="7" height="287" rx="3"/><text x="62" y="1301" font-size="23" class="title" font-weight="700">B6  중량 적용·영양 결과 갱신</text><text x="62" y="1328" font-size="16" class="sub">서버 → 앱 · PATCH /api/v1/meals/{id}</text><text x="62" y="1359" font-size="16" class="label" font-weight="700">입력</text><text x="108" y="1359" font-size="18" class="">arMeasurement{A,h,높이 방식·근거}</text><text x="108" y="1384" font-size="18" class="">선택 음식명·foodId · 식단 버전</text><text x="62" y="1419" font-size="16" class="label" font-weight="700">출력</text><text x="108" y="1419" font-size="18" class="">서버 재계산 grams · nutrition</text><text x="108" y="1444" font-size="18" class="">weightMeasurement · 완료 상태</text><text x="62" y="1478" font-size="16" class="sub">새 중량으로 기존 음식의 영양값을 갱신합니다.</text></g><path class="connector" d="M500 1046 H534" marker-end="url(#arrow)"/><path class="connector" d="M1000 1046 H1034" marker-end="url(#arrow)"/><path class="connector" d="M1270 1192 V1264" marker-end="url(#arrow)"/><text x="1040" y="1233" font-size="17" class="flow-label" font-weight="600">기기 높이 유무에 따라 분기</text><path class="connector" d="M1040 1413 H1006" marker-end="url(#arrow)"/><path class="connector" d="M540 1413 H506" marker-end="url(#arrow)"/><rect class="formula" x="40" y="1595" width="1460" height="100" rx="14"/><text x="65" y="1632" font-size="22" class="title" font-weight="700">공통 영양 계산</text><text x="65" y="1669" font-size="24" class="title" font-weight="600">섭취 영양량 = DB 기준 영양량 × 최종 중량(g) ÷ DB 기준 중량(g)</text><text x="40" y="1737" font-size="20" class="title" font-weight="700">읽는 방법</text><text x="40" y="1770" font-size="18" class="sub">실선: 처리 순서   ·   점선: 사용자 선택 경로   ·   ?: 측정 불가 시 null인 값   ·   각 출력은 다음 단계의 입력으로 전달</text><text x="40" y="1803" font-size="18" class="sub">깊이 적분 부피 depthVolumeMl은 참고용입니다. 최종 중량 산식은 면적 × 평균 높이 × 밀도이며 검증 여부는 별도 기록합니다.</text></svg>